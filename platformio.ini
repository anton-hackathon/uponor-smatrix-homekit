[platformio]
# Без этого `pio run -t upload` пытался бы загрузить прошивку и по воздуху тоже.
# Для загрузки по воздуху окружение указывается явно: pio run -e ota -t upload
default_envs = esp32dev

[env]
# HomeSpan 2.1.8 требует ядро arduino-esp32 версии не ниже 3.3.0. В реестре
# PlatformIO пакет espressif32 остановился на ядре 2.0.x, поэтому берём
# ответвление pioarduino (55.03.311 = Arduino 3.3.11 на ESP-IDF 5.5.5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
# Прошивка с HomeSpan занимает около 1,4 МБ — в стандартный раздел на 1,31 МБ
# не помещается. Схема min_spiffs даёт 1,97 МБ на слот и сохраняет оба раздела
# для загрузки по воздуху.
board_build.partitions = min_spiffs.csv
lib_deps = https://github.com/HomeSpan/HomeSpan.git#2.1.8
build_flags = -DCORE_DEBUG_LEVEL=0

# Загрузка по USB. Применимо, когда плата подключена к компьютеру кабелем.
[env:esp32dev]
monitor_speed = 115200
# Микросхема CH340 разрывает связь на скорости 460800 (стандартной для
# загрузчика) сразу после старта загрузчика-заглушки, поэтому понижаем до 115200.
upload_speed = 115200
# Последовательный порт определяется автоматически. Если у вас несколько
# устройств, укажите порт явно, например:
#   upload_port = /dev/cu.usbserial-XXXX

# Загрузка по воздуху через сервер обновлений HomeSpan: pio run -e ota -t upload
# Пароль — стандартный DEFAULT_OTA_PASSWORD из HomeSpan (проверяется по хешу
# SHA-256, который плата выводит при запуске). Меняется командой 'O' в консоли.
#
# Важно (только для macOS): espota запускается системным /usr/bin/python3, а не
# интерпретатором из виртуального окружения. Причина: .venv/bin/python — ссылка
# на Python из Homebrew с временной (ad-hoc) цифровой подписью. У такой подписи
# нет устойчивого идентификатора, поэтому macOS не выдаёт ей разрешение
# «Локальная сеть», и любые обращения к своей подсети завершаются ошибкой
# `errno 65 No route to host` (при этом внешние адреса доступны). Проявляется как
# `ERROR: Host uponor.local Not Found` через пару секунд. Системный Python
# подписан Apple, ему доступ разрешён.
[env:ota]
upload_protocol = espota
# Имя из mDNS удобнее фиксированного адреса: не зависит от того, какой IP выдал
# роутер. Совпадает с DEVICE_HOSTNAME в config.h.
upload_port = uponor.local
upload_command = /usr/bin/python3 "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/espota.py" -i $UPLOAD_PORT -p 3232 -a homespan-ota -f "$SOURCE"
